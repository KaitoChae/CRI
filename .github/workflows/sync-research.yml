name: Sync publications, journal metrics and graphical abstracts

on:
  schedule:
    # Discover new papers and citations four times daily (UTC).
    - cron: '13 0,6,12,18 * * *'
    # Check for updated SCImago rankings daily (SJR itself changes annually).
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      update_scimago:
        description: 'Fetch latest SCImago CSV rankings'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: research-website-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover publications and citation counts
        run: node scripts/sync-publications.mjs
      - name: Recheck explicitly dated journal Impact Factors
        run: node scripts/refresh-verified-jif.mjs
      - name: Refresh all distinct journal sources
        run: |
          if [ "${{ github.event.schedule }}" = '47 3 * * *' ] || [ "${{ inputs.update_scimago }}" = 'true' ]; then
            node assets/update-journal-metrics.mjs --scimago
          else
            node assets/update-journal-metrics.mjs
          fi
      - name: Refresh journal homepages from verified OpenAlex sources
        run: node scripts/update-journal-links.mjs
      - name: Look for missing or newly released publisher graphics
        run: node scripts/update-publication-visuals.mjs
      - name: Validate generated data
        run: node --test tests/*.test.mjs
      - name: Commit only changed public data and verified images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/publications.js assets/journal-metrics.js assets/jcr-jif-overrides.json assets/publications/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh publication index and journal indicators'
            git push
          else
            echo 'No updates to publish.'
          fi
