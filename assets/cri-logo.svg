<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">CRI personal research logo</title>
  <desc id="desc">A CRI monogram surrounded by atomic orbits and a protective material ring</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd66e"/>
      <stop offset="1" stop-color="#e96f45"/>
    </linearGradient>
  </defs>
  <circle cx="160" cy="160" r="142" fill="#071c2a" stroke="url(#ring)" stroke-width="10"/>
  <g fill="none" stroke="#a9c6d8" stroke-width="5" opacity=".88">
    <ellipse cx="160" cy="160" rx="112" ry="42"/>
    <ellipse cx="160" cy="160" rx="112" ry="42" transform="rotate(60 160 160)"/>
    <ellipse cx="160" cy="160" rx="112" ry="42" transform="rotate(-60 160 160)"/>
  </g>
  <g fill="#ffd66e">
    <circle cx="272" cy="160" r="8"/>
    <circle cx="104" cy="63" r="8"/>
    <circle cx="104" cy="257" r="8"/>
  </g>
  <circle cx="160" cy="160" r="72" fill="#f3eee7" stroke="#fff" stroke-width="4"/>
  <text x="160" y="181" text-anchor="middle" fill="#071c2a" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800" letter-spacing="-5">CRI</text>
</svg>
